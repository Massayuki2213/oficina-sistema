# Hermes — integração contínua: todo push e pull request passa por aqui.
# Lint → tipos → testes (com PostgreSQL de verdade) → build → imagem Docker,
# e em paralelo: segredos no histórico do git e vulnerabilidades conhecidas.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seguranca:
    name: Segredos e vulnerabilidades
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          # O histórico inteiro: segredo commitado e depois apagado continua nos commits antigos.
          fetch-depth: 0

      - name: Segredos no histórico do git (gitleaks)
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git . --redact --verbose --exit-code 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Só o que roda em produção; o lockfile basta (sem instalar nada).
      # Alerta moderado aparece no log; alto ou crítico reprova.
      - name: Vulnerabilidades conhecidas (npm audit)
        run: npm audit --omit=dev --audit-level=high

  qualidade:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hermes
          POSTGRES_PASSWORD: hermes_dev
          POSTGRES_DB: hermes_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hermes -d hermes_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      TEST_DATABASE_URL: postgresql://hermes:hermes_dev@localhost:5432/hermes_test?schema=public
      TZ: America/Sao_Paulo

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Dependências
        run: npm ci

      - name: Prisma Client
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      - name: Banco de teste (migrações)
        run: npm run test:prepare

      - name: Testes (contrato, API e tela)
        run: npm test

      - name: Build (tela + API)
        run: npm run build

  docker:
    name: Imagem Docker
    runs-on: ubuntu-latest
    needs: qualidade
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build da imagem (sem publicar)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: hermes:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
