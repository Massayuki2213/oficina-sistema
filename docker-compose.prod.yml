# ==========================================================
# Hermes — produção no mini PC da oficina (Linux): banco + sistema.
#
# Não se edita à mão: o ops/instalar.sh gera o .env ao lado deste arquivo
# (segredos aleatórios) e sobe tudo; o ops/atualizar.sh troca a versão.
# Passo a passo: docs/IMPLANTACAO.md.
#
# Acesso: http://<ip-do-mini-pc> (porta 80) em qualquer navegador da rede.
# O primeiro acesso cria o usuário Dono.
# ==========================================================
name: hermes

# Sem limite, o log do Docker cresce para sempre no SSD: no máximo 5 × 10 MB por serviço.
x-logs: &logs
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # Relógio do banco no fuso da oficina (o psql mostra a hora local). Os horários
    # continuam gravados em UTC: quem grava é a aplicação (tests/fuso.test.ts).
    command: ["postgres", "-c", "timezone=${TZ:-America/Sao_Paulo}", "-c", "log_timezone=${TZ:-America/Sao_Paulo}"]
    environment:
      POSTGRES_USER: hermes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: hermes
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - dados:/var/lib/postgresql/data
    # Sem porta publicada: o banco só conversa com o sistema, dentro do Docker.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hermes -d hermes"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    # Queda de luz com nobreak: dá tempo ao banco de fechar direito.
    stop_grace_period: 1m
    <<: *logs

  app:
    # Imagem publicada pelo CI a cada versão (ghcr.io, pública). Atualizar ou
    # voltar atrás = trocar HERMES_VERSAO no .env (o ops/atualizar.sh faz isso).
    image: "${HERMES_IMAGEM:-ghcr.io/massayuki2213/oficina-sistema}:${HERMES_VERSAO:?Defina HERMES_VERSAO no .env, por exemplo v1.0.0}"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Conexão do DONO do banco: só para as migrações e os comandos de administração.
      # Na partida, o servidor passa a usar o hermes_app, que só lê e grava dados
      # (docker/entrypoint.sh). DB_USUARIO_APP=false desliga isso (banco gerenciado).
      DATABASE_URL: postgresql://hermes:${POSTGRES_PASSWORD}@db:5432/hermes?schema=public
      DB_USUARIO_APP: ${DB_USUARIO_APP:-true}
      SESSAO_SEGREDO: ${SESSAO_SEGREDO:?Defina SESSAO_SEGREDO no .env (openssl rand -hex 32)}
      SESSAO_DURACAO: ${SESSAO_DURACAO:-12h}
      TZ: ${TZ:-America/Sao_Paulo}
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      BACKUP_ENABLED: ${BACKUP_ENABLED:-true}
      BACKUP_RETENCAO_DIAS: ${BACKUP_RETENCAO_DIAS:-14}
      # Segunda cópia no HD externo (montado abaixo). BACKUP_DIR_EXTERNO= vazio
      # no .env desliga a cópia e o aviso de "HD desconectado".
      BACKUP_DIR_EXTERNO: ${BACKUP_DIR_EXTERNO-/app/backups-externo}
      BACKUP_RETENCAO_DIAS_EXTERNO: ${BACKUP_RETENCAO_DIAS_EXTERNO:-60}
      # Opcional: cifra as cópias (docs/IMPLANTACAO.md → "Backup cifrado").
      # Obrigatório se o HD externo sair da oficina (guardado em casa, por exemplo).
      BACKUP_SENHA: ${BACKUP_SENHA:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      # A porta 80 é só do lado do mini PC (endereço http://<ip>); dentro do
      # container a API segue na 3333.
      - "${HERMES_PORT:-80}:3333"
    volumes:
      # Cópias de backup numa pasta do mini PC (SSD): os scripts de ops/ e o
      # rclone leem daqui. Dono da pasta: uid 1000 (o usuário da imagem).
      - ${HERMES_BACKUPS:-/srv/hermes/backups}:/app/backups
      # Raiz do HD externo (fstab por UUID, com nofail). rslave: se o HD for
      # montado depois que o sistema subiu, ele aparece aqui dentro sem reiniciar.
      # Sem o HD, a pasta fica vazia (sem o arquivo-marca) e o sistema avisa o Dono.
      - type: bind
        source: ${HERMES_HD_EXTERNO:-/mnt/hermes-backup}
        target: /app/backups-externo
        bind:
          propagation: rslave
          create_host_path: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3333/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    <<: *logs

volumes:
  dados:
