# Hermes — banco de dados para DESENVOLVIMENTO.
# Uso:  docker compose up -d      |  parar: docker compose down
#
# A porta do HOST vem do .env (POSTGRES_PORT). Em máquina que já roda outro
# Postgres na 5432, é só mudar lá — sem editar este arquivo.
#
# Para instalar na oficina (banco + sistema), use o docker-compose.prod.yml
# (passo a passo em docs/IMPLANTACAO.md).
services:
  postgres:
    image: postgres:16-alpine
    container_name: hermes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hermes
      POSTGRES_PASSWORD: hermes_dev
      POSTGRES_DB: hermes
      TZ: America/Sao_Paulo
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - hermes_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hermes -d hermes"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  hermes_pgdata:
