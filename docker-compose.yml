# Hermes — infraestrutura local de desenvolvimento
# Sobe o banco de dados (PostgreSQL) e o cache (Redis).
# Uso:  docker compose up -d      |  para: docker compose down
#
# As portas do HOST são configuráveis pelo .env (POSTGRES_PORT / REDIS_PORT).
# Em máquina que já roda outro Postgres na 5432, é só mudar lá — sem editar
# este arquivo. O padrão continua sendo a porta de sempre.
services:
  postgres:
    image: postgres:16-alpine
    container_name: hermes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hermes
      POSTGRES_PASSWORD: hermes_dev
      POSTGRES_DB: hermes
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - hermes_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hermes -d hermes"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hermes-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - hermes_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  hermes_pgdata:
  hermes_redisdata:
